<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lojas – Stardew Valley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/itens.css">
  <link rel="stylesheet" href="css/lojas.css">
</head>
<body>
  <!-- ===== MENU (copie este bloco em toda página interna; mude só a classe is-active) =====
       A bolinha (.menu-fab) é o único botão: abre e fecha a barra de ícones. -->
  <button class="menu-fab" type="button" data-menu-toggle aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="menu-fundo"></div>

  <aside class="menu" id="menu" aria-label="Menu principal">
    <nav aria-label="Páginas">
      <ul class="menu__lista">
        <li class="menu__item">
          <a class="menu__link" href="home.html" title="Home">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 3.5 20.5 11V20.5H14.5V14.5H9.5V20.5H3.5z"/></svg>
            <span class="sr-only">Home</span>
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="perfil.html" title="Perfil">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.5-2.4 3.3-3.5 5.5-3.5s4 1.1 5.5 3.5"/></svg>
            <span class="sr-only">Perfil</span>
          </a>
        </li>
        <li class="menu__item is-active">
          <a class="menu__link" href="lojas.html" title="Lojas" aria-current="page">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/><path d="M9 13c.8 1.2 1.8 1.8 3 1.8s2.2-.6 3-1.8"/></svg>
            <span class="sr-only">Lojas</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="pagina">
    <main class="pagina__conteudo">    
      <div class="loja">

        <!-- abas Comprar / Vender + dinheiro -->
        <div class="loja__abas" role="tablist" aria-label="Modo da loja">
          <button class="aba" role="tab" type="button" data-modo="comprar" aria-selected="true">Comprar</button>
          <button class="aba" role="tab" type="button" data-modo="vender" aria-selected="false">Vender</button>
          <p class="loja__dinheiro" id="loja-dinheiro" aria-label="Seu dinheiro">money</p>
        </div>

        <!-- NPCs -->
        <section class="npcs" aria-label="Vendedores">
          <div class="npcs__sprite">
            <!-- TODO: trocar pelo sprite do NPC selecionado -->
            <img id="npc-sprite" src="assets/img/npc-placeholder.svg" alt="Sprite do vendedor" width="172" height="172">
          </div>
          <!-- os botões dos NPCs entram aqui (js/lojas.js, dados em api.js → getNpcs) -->
          <div class="npcs__lista" id="npcs-lista"></div>
        </section>

        <!-- itens à venda (aba Comprar) ou inventário do jogador (aba Vender) -->
        <section class="loja__itens" aria-label="Itens">
          <p class="loja__aviso" id="loja-aviso" role="status"></p>
          <div class="grade-itens" id="loja-itens"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===== MODELO DE ITEM (loja e venda usam o mesmo card; o botão tem data-acao) ===== -->
  <template id="tpl-item-card">
    <article class="item-card" data-item-id="">
      <svg class="estrela" data-quality="0" viewBox="0 0 24 24" role="img" aria-label="Qualidade"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
      <img class="item-card__img" src="assets/img/item-placeholder.svg" alt="" width="96" height="96">
      <h3 class="item-card__nome" data-slot="nome">Nome</h3>
      <p class="item-card__linha" data-slot="preco">Preço</p>
      <p class="item-card__linha" data-slot="tipo">Tipo</p>
      <button class="btn btn--pequeno item-card__acao" type="button" data-acao>Comprar</button>
    </article>
  </template>

  <script src="js/menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/lojas.js"></script>
</body>
</html>
