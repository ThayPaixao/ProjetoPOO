<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vila – Stardew Valley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/itens.css">
  <link rel="stylesheet" href="css/vila.css">
  <link rel="shortcut icon" type="image/png" href="assets/img/Icon.png">
</head>
<body>
  <!-- ===== MENU (copie este bloco em toda página interna; mude só a classe is-active) =====
       A bolinha (.menu-fab) é o único botão: abre e fecha a barra de ícones. -->
  <button class="menu-fab" type="button" data-menu-toggle aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="menu-fundo"></div>

  <aside class="menu" id="menu" aria-label="Menu principal">
    <nav aria-label="Páginas">
      <ul class="menu__lista">
        <li class="menu__item">
          <a class="menu__link" href="home.html" title="Home">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 3.5 20.5 11V20.5H14.5V14.5H9.5V20.5H3.5z"/></svg>
            <span class="sr-only">Home</span>
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="perfil.html" title="Perfil">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.5-2.4 3.3-3.5 5.5-3.5s4 1.1 5.5 3.5"/></svg>
            <span class="sr-only">Perfil</span>
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="lojas.html" title="Lojas">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/><path d="M9 13c.8 1.2 1.8 1.8 3 1.8s2.2-.6 3-1.8"/></svg>
            <span class="sr-only">Lojas</span>
          </a>
        </li>
        <li class="menu__item is-active">
          <a class="menu__link" href="vila.html" title="Vila: ranking, conquistas e diário" aria-current="page">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4.5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5v1a3.5 3.5 0 0 0 3.3 3.5M17 6h2.5v1a3.5 3.5 0 0 1-3.3 3.5"/><path d="M12 13.5V17M9.5 17h5v3.5h-5z"/></svg>
            <span class="sr-only">Vila</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="pagina">
    <!-- usa as caixas de "vidro fosco" da home (css/home.css); o resto está em css/vila.css -->
    <main class="pagina__conteudo home vila">
      <section class="bloco bloco--largo" aria-labelledby="ranking-titulo">
        <h2 class="bloco__titulo" id="ranking-titulo">Ranking da vila</h2>
        <p class="bloco__texto vila__dica">Quem mais lucrou vendendo para os moradores.</p>
        <ol class="ranking" id="ranking-lista"></ol>
      </section>

      <section class="bloco bloco--largo" id="conquistas" aria-labelledby="conquistas-titulo">
        <h2 class="bloco__titulo" id="conquistas-titulo">Conquistas <span class="vila__contador" id="conquistas-contador"></span></h2>
        <ul class="conquistas" id="conquistas-lista"></ul>
      </section>

      <section class="bloco bloco--largo" aria-labelledby="diario-titulo">
        <h2 class="bloco__titulo" id="diario-titulo">Diário de gostos</h2>
        <p class="bloco__texto vila__dica">O que você já descobriu vendendo: aparece só o que você já vendeu para cada morador.<br>♥ ama &nbsp;·&nbsp; sem símbolo = neutro &nbsp;·&nbsp; ✗ odeia</p>
        <div class="diario" id="diario-lista"></div>
      </section>

      <p class="vila__aviso" id="vila-aviso" role="status"></p>
    </main>
  </div>

  <!-- ===== MODELOS (js/vila.js preenche uma cópia para cada linha) ===== -->
  <template id="tpl-ranking">
    <li class="ranking__linha">
      <span class="ranking__posicao" data-campo="posicao"></span>
      <img class="ranking__foto" src="assets/img/avatar-placeholder.svg" alt="" width="40" height="40">
      <span class="ranking__nome" data-campo="nome"></span>
      <span class="ranking__vendas" data-campo="vendas"></span>
      <strong class="ranking__lucro" data-campo="lucro"></strong>
    </li>
  </template>

  <template id="tpl-conquista">
    <li class="conquista">
      <svg class="conquista__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4.5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5v1a3.5 3.5 0 0 0 3.3 3.5M17 6h2.5v1a3.5 3.5 0 0 1-3.3 3.5"/><path d="M12 13.5V17M9.5 17h5v3.5h-5z"/></svg>
      <div class="conquista__textos">
        <h3 class="conquista__nome" data-campo="nome"></h3>
        <p class="conquista__descricao" data-campo="descricao"></p>
        <div class="conquista__barra"><span class="conquista__preenchido"></span></div>
        <p class="conquista__progresso" data-campo="progresso"></p>
      </div>
    </li>
  </template>

  <template id="tpl-morador">
    <article class="morador">
      <header class="morador__cabeca">
        <img class="morador__retrato" src="assets/img/npc-placeholder.svg" alt="" width="56" height="56">
        <div>
          <h3 class="morador__nome" data-campo="nome"></h3>
          <p class="morador__contador" data-campo="contador"></p>
        </div>
      </header>
      <ul class="morador__itens"></ul>
    </article>
  </template>

  <script src="js/menu.js"></script>
  <script src="js/autosave.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/vila.js"></script>
</body>
</html>
